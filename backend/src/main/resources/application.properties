# <-------------------IDENTIFICAÇÃO E SERVIDOR LOCAL------------------->
# O Spring Boot lê esse arquivo automaticamente ao iniciar a aplicação

spring.application.name=clinicalstudypb

# onde o backend recebe as requisições
# Se existir uma variável de ambiente chamada SERVER_PORT, usar o valor dela.
# Caso contrário, usar 8080
server.port=${SERVER_PORT:8080}

# <-------------------RESPOSTAS DE ERRO------------------->
# O cliente recebe mensagens controladas, nunca detalhes internos de exceções
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# <-------------------PERSISTÊNCIA------------------->
# As variáveis SPRING_DATASOURCE_URL, USERNAME e PASSWORD são configuradas no ambiente
# Flyway altera o banco e Hibernate apenas confere sua estrutura
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# <-------------------SESSÃO E ORIGEM DA WEB------------------->
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
app.seguranca.origens-permitidas=${WEB_ORIGINS:http://localhost:5173}

# <-------------------DOCUMENTAÇÃO DA API------------------->
# O contrato descreve os controllers reais; cada operação documenta seus erros
springdoc.override-with-generic-response=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.with-credentials=true
